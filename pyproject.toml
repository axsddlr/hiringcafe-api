[project]
name = "hiringcafe-api"
version = "1.0.0"
description = "Turn HiringCafe job search into a clean JSON API: keyword and US ZIP in, normalized job records out"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scrapling[fetchers]>=0.5",
    "curl_cffi>=0.7",
]

# PEP 735 dependency group: installed by a plain `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/Query() idiom lives in argument defaults by design.
ignore = ["B008"]

[tool.coverage.run]
# models.py is TypedDict documentation only; it has no executable statements
# worth measuring and would otherwise report 0% and drag the total down.
omit = ["app/models.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
